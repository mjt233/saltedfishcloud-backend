# 咸鱼云离线下载微服务配置（原 sfc-ext-download 插件迁移）
#
# 架构位置：本服务是独立进程，通过 sfc-task-worker SDK 以 SERVICE 角色接入 sfc-core 的统一异步任务系统；
# 文件读写与用户身份查询经 sfc-remote-client 回调 core 的接口完成；本服务只维护自己的下载任务表（SQLite）。
#
# ⚠️ 身份传递：本服务从网关注入的 X-Sfc-Uid 信任头读取当前用户，不做校验——只允许内网 / 本机暴露，
#    对外入口只有 sfc-gateway。管理员判定经 sfc-remote-client 回源到 core。
# ⚠️ 调用 core 内部接口（/api/internal/**）需要服务间共享密钥：本服务与 core 必须使用同一份
#    sfc.internal.key（← 环境变量 SFC_INTERNAL_KEY），否则无法签发调用凭证（任务提交/查询/取消必然失败）。
#    留空时：应用仍可启动，但任务 Worker 启动自检失败并自动禁用认领。
server:
  port: 8092

spring:
  servlet:
    encoding:
      charset: utf-8
      force: true
      enabled: true
  application:
    name: sfc-download-service
  mvc:
    # 前端插件静态资源（index.umd.js / style.css）经该前缀暴露，core 的 /api/plugin/autoLoad.js 会按
    # 注册中心 metadata 中的 sfc.plugin.autoload 拼接出这些 URL
    static-path-pattern: "/static/**"
  # 服务发现/注册参数：全部可用环境变量覆盖，容器部署无需修改本文件
  #   模式选择：SFC_LOCAL_ENABLED=true（默认）走 local 注册中心，与 sfc-core 内置注册中心对接；
  #            改走 Nacos 时置 SFC_LOCAL_ENABLED=false 且 NACOS_ENABLED=true。
  #   常用变量：SFC_LOCAL_REGISTRY_ADDR / SFC_LOCAL_REGISTRY_PASSWORD / SFC_LOCAL_REGISTRY_HOST /
  #            NACOS_SERVER_ADDR / NACOS_GROUP / NACOS_NAMESPACE / NACOS_USERNAME / NACOS_PASSWORD
  cloud:
    # local 注册中心：与 core 的内置注册中心对接（服务端地址/密码与 core 的
    # sys.service.local-registry 配置对应）
    sfc-local:
      enabled: ${SFC_LOCAL_ENABLED:true}
      server-addr: "${SFC_LOCAL_REGISTRY_ADDR:localhost:8087}"
      password: "${SFC_LOCAL_REGISTRY_PASSWORD:114514}"
      # 注册到注册中心的 host；留空 = 自动探测（容器内即容器 IP，与 core 同网络时可直接访问）
      host: "${SFC_LOCAL_REGISTRY_HOST:}"
      metadata:
        # 配置面板入口：core 的 ConfigController#listServicesPluginConfig 发现该 metadata 后会
        # 请求本服务的 /api/meta/pluginInfo，在管理员后台渲染「插件配置」面板
        sfc.plugin.info: /api/meta/pluginInfo
        sfc.plugin.autoload: /static/index.umd.js,/static/style.css
    nacos:
      discovery:
        # 默认走 local 注册中心；切换 Nacos 时把 NACOS_ENABLED 置为 true 并把 SFC_LOCAL_ENABLED 置为 false
        enabled: ${NACOS_ENABLED:false}
        server-addr: "${NACOS_SERVER_ADDR:127.0.0.1:8848}"
        # ⚠️ 收敛约定：必须与 core / 网关的 group 一致（同为 SFC），否则"注册成功但互相看不见"
        group: ${NACOS_GROUP:SFC}
        # 命名空间 public 的 ID 是【空串】，不要写 public
        namespace: "${NACOS_NAMESPACE:}"
        # 服务端未开启鉴权时留空
        username: "${NACOS_USERNAME:}"
        password: "${NACOS_PASSWORD:}"
        # 临时实例：客户端心跳续约，停服后实例自动消失
        ephemeral: true
        metadata:
          sfc.plugin.info: /api/meta/pluginInfo
          sfc.plugin.autoload: /static/index.umd.js,/static/style.css
  datasource:
    driver-class-name: org.sqlite.JDBC
    # 本服务独立的下载任务库，与 core 的数据库无关（历史下载数据不迁移）。
    #
    # ⚠️ 并发写加固（T7 联调发现 SQLITE_BUSY）：本服务默认 8 个并发下载任务，任务在开始/收尾时
    #    会集中回写 download_task（status/size/name/finish_at），而 SQLite 默认写锁冲突立即失败。
    #      · journal_mode=WAL —— 读写可并发：写事务进行时读请求不再被阻塞，显著降低"等待中任务列表"
    #        与"任务进度回写"之间的锁冲突；
    #      · busy_timeout=5000 —— 写锁被占用时最多等待 5 秒再报错，覆盖多个任务同时落盘/收尾的瞬间。
    #    仍建议生产环境按实际并发量调低 sfc.task.worker.max-concurrent-tasks，或改用更高并发的数据库；
    #    本服务当前只支持 SQLite（无需额外数据库部署，适合轻量部署场景）。
    #    容器部署：镜像 ENV SFC_DOWNLOAD_DB_URL 已把数据文件指向 /data/download.db（配合数据卷持久化）
    url: "${SFC_DOWNLOAD_DB_URL:jdbc:sqlite:./download.db?journal_mode=WAL&busy_timeout=5000}"
    # ⚠️ SQLite 单写者：固定单连接，让所有并发写事务在连接池排队后串行执行（T9 §7-9 收口）。
    #    背景：8 个请求同时创建任务时，Hibernate merge 会「先 SELECT 再 UPDATE」——若期间存在另一个
    #    写连接，WAL 下该事务的读快照会失效，抛 SQLITE_BUSY_SNAPSHOT；这类快照冲突不受 busy_timeout
    #    等待策略覆盖（busy handler 只处理锁竞争，不处理快照失效），因此仅靠 URL 参数无法修复。
    #    单连接同时消除 INSERT 竞争与快照升级冲突：写事务在池内排队，同一时刻只会有本连接一个写者。
    #    本服务的 DB 操作均为毫秒级短事务（创建/回写状态、分页查询），单连接不会成为瓶颈；
    #    若未来换成 MySQL 等支持并发写的数据库，移除下面两条限制即可恢复连接池并发。
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
  jpa:
    # default = 由 Hibernate 自行探测方言（SQLite 方言来自 hibernate-community-dialects）
    database: default
    open-in-view: false
    hibernate:
      # 本服务自己的表由本服务负责建/更新
      ddl-auto: update
    properties:
      hibernate:
        order_inserts: true
        jdbc:
          batch_size: 200
sfc:
  internal:
    # 服务间内部鉴权共享密钥（与 core 的 sfc.internal.key 必须一致）
    key: ${SFC_INTERNAL_KEY:}
  # 异步任务执行者（Worker）SDK 配置：本服务实现 SfcTaskHandler 后即可认领并执行 core 调度的离线下载任务
  task:
    worker:
      enabled: true
      # 离线下载属于 IO 密集型任务，并发上限不必与 CPU 核数对齐，按宿主机带宽/磁盘能力设置为 8
      max-concurrent-tasks: 8
  # 本服务内部调优（部署期配置，修改后需重启生效）。
  # ⚠️ 这里【只】放与部署环境相关、与业务无关的参数。aria2 / Git 等业务开关统一由 sfc-core 的
  #    系统配置管理（管理员后台「插件配置」面板 → 存 core 配置表 → 本服务经 SfcDownloadConfigService
  #    读取），刻意不在 yml 里重复声明，避免「两处取值、排障时无法判断谁生效」的双数据源问题。
  download:
    config:
      # 统一配置快照缓存时长（毫秒）：管理员在 core 后台改完配置后，最长该时长即生效，无需重启
      refresh-interval-millis: 5000
    capability:
      # 下载类型能力（例如 aria2 是否可达）的探测结果缓存时长（秒）
      cache-seconds: 30
