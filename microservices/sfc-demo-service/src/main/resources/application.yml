# demo 微服务配置（阶段 4：双向注册验证；**保留为微服务示例**）
#
# 全部注册参数都走 Spring Cloud Alibaba 的声明式配置：本工程没有任何一行手写注册代码。
#
# ⚠️ 身份传递（框架期「信任模式」）：本服务从网关注入的 X-Sfc-Uid 头读取当前用户，
#    **不做任何校验**——服务间调用鉴权整体后置（docs/plan/microservice/microservice-roadmap.md 阶段 5）。
#    因此本服务【只允许内网 / 本机暴露】，对外入口只有 sfc-gateway。
# ⚠️ 网关会把用户的会话凭证【原值透传】过来（Token 头 / token cookie / ?Token=），
#    供下游做自己的完整校验；本服务不得把它写入日志或任何响应体（见 docs/plan/todo.md）。
#
# 调用 core 内部接口（/api/internal/**）需要服务间共享密钥：各服务用同一份密钥自行签发调用凭证
# （配置项 sfc.internal.key ← 环境变量 SFC_INTERNAL_KEY，由 sfc-auth SDK 提供）。
# 留空时：本服务无法签发凭证（调用 core 必然失败），且任务 Worker 启动自检失败、自动禁用认领（应用仍可启动）；
# core 侧未配置时对外一律 403（fail-closed）。
sfc:
  internal:
    key: ${SFC_INTERNAL_KEY:}
  # 异步任务执行者（Worker）SDK 配置：本服务实现 SfcTaskHandler 后即可认领并执行 sfc-core 调度的任务
  # 执行者身份取自服务注册中心（serviceId + host:port），core 通过服务发现判定存活并回调中断端点
  task:
    worker:
      # 是否作为任务执行者启动（默认 true）。启动后会先确认内部鉴权已配置、本实例已在注册中心可见，再长轮询认领并执行任务
      enabled: true
      # sfc-core 在服务注册中心中的服务名（默认 sfc-core），worker 经负载均衡按该服务名选取 core 实例
      # core-service-id: sfc-core
      # 所属服务名，留空时取服务注册信息（Registration）中的 serviceId
      # service-name: sfc-demo-service
      # 本实例的执行者角色，默认 SERVICE（微服务保持默认即可；core 节点内嵌的 Worker 为 CORE）
      # role: SERVICE
      # 认领任务的长轮询等待秒数，默认 30；满载时 SDK 自动缩短为不超过 3 秒（只认领紧急任务）
      # claim-wait-seconds: 30
      # 最大并发执行任务数，默认 CPU 核数；满载后只认领紧急任务（紧急任务不受该上限限制）
      # max-concurrent-tasks: 8
server:
  # 避开咸鱼云宿主的 8087、Nacos 控制台的 8080 与控制台 API 的 8848/9848
  port: 8090

spring:
  application:
    # 注册到 Nacos 的服务名。咸鱼云侧是 sfc-core，本服务是 sfc-demo-service
    name: sfc-demo-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # ⚠️ 收敛约定：必须与咸鱼云侧 spring.cloud.nacos.discovery.group 一致（同为 SFC）。
        # 两侧都只按各自配置的 group 查询，不一致的现象是"注册成功但互相看不见"。
        group: SFC
        # 命名空间 public 的 ID 是【空串】，不要写 public
        namespace: ""
        # 临时实例：由客户端内置心跳续约，也是"停服后实例自动消失"（4.5）的前提。
        # 与咸鱼云侧的临时实例配置对齐
        ephemeral: true
        # 实例 metadata：微服务的「自描述」——网关不硬编码任何微服务的路径。
        #   sfc.api.prefix —— 网关判定时拼接的 API 前缀（缺省 /api，见网关的 sfc.gateway.default-api-prefix）
        #   sfc.version    —— 供前端资源 URL 带版本号（阶段 7）
        metadata:
          sfc.api.prefix: /api
          sfc.version: 1.0.0
