services:
  # 服务发现/注册中心 Nacos
  nacos:
    image: nacos/nacos-server:v3.3.0
    container_name: nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      # accessToken 签名密钥：Base64 编码且解码后不少于 32 字节，生产环境必须自行生成覆盖（`openssl rand -base64 32`）
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-qYI/kHj74aR5NnPeSd/yuQUyg3+CXGABv4exxziPNTU=}
      # 服务端节点间身份识别的 key/value，集群部署时各节点需保持一致，生产环境请自行替换
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-nacos-server-identity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos-server-identity-value}
    networks:
      - nacos
    expose:
      - 8848
      - 9848
      - 8080
     # 映射端口到本机，建议只在开发和测试环境直接使用，生产环境请自行配置防火墙或反向代理，避免直接暴露到公网
#    ports:
#      - 8080:8080
#      - 8848:8848
#      - 9848:9848
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8848/nacos/v3/admin/core/state/readiness 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Nacos 单机启动通常需要 20~60s，此期间探针失败不计入 retries
      start_period: 30s

  # aria2（P2P 下载引擎，供 sfc-download-service 通过 JSON-RPC 调用）
  # ⚠️ 生产环境必须用 ARIA2_RPC_SECRET 覆盖默认令牌，并与 sfc-download-service 的
  #    SFC_DOWNLOAD_ARIA2_SECRET 保持一致（两处都取同一个 ${ARIA2_RPC_SECRET}）。
  # ⚠️ PUID/PGID=0 与下载服务镜像（以 root 运行）对齐，保证共享卷可互相读写；UMASK_SET 建议 022。
  #    下载服务侧共享路径为 /shared/download，aria2 侧为 /downloads（见下载服务的 remote-dir 映射）。
  # ⚠️ 首次启动会从 GitHub 拉取默认 aria2.conf（需要外网）；RPC_SECRET 只在该次初始化时写入
  #    ./data/download/aria2-config/aria2.conf，之后修改环境变量不会自动生效——需同步修改该文件或清空配置目录。
  #    生产也可替换为其它 aria2 镜像（要求：开启 RPC、令牌与下载服务一致、挂载同一共享卷）。
  aria2:
    image: p3terx/aria2-pro
    container_name: sfc-aria2
    networks:
      # 与下载服务同网络，下载服务通过 http://aria2:6800/jsonrpc 访问；无需对外暴露端口
      - nacos
    volumes:
      # 与 sfc-download-service 的 ./data/download/shared:/shared/download 指向同一宿主目录
      - ./data/download/shared:/downloads
      - ./data/download/aria2-config:/config
    environment:
      RPC_SECRET: ${ARIA2_RPC_SECRET:-sfc-aria2-dev-secret}
      PUID: 0
      PGID: 0
      UMASK_SET: "022"
      TZ: Asia/Shanghai
    restart: unless-stopped

  # 离线下载服务
  sfc-download-service:
    image: sfc/sfc-download-service:latest
    container_name: sfc-download-service
    build:
      context: .
      dockerfile: microservices/sfc-download-service/Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    depends_on:
      # 等待 Nacos 健康检查通过（8848 就绪接口）后再启动，避免注册失败
      nacos:
        condition: service_healthy
    networks:
      # 必须接入 nacos 网络，否则解析不到 nacos:8848，也无法被 core/网关发现
      - nacos
    volumes:
      - ./data/download:/data
      # 与 aria2 容器共享的下载目录（本服务容器内路径，对应 SFC_DOWNLOAD_ARIA2_SHARED_DIR）
      - ./data/download/shared:/shared/download
    environment:
      # 启用 Nacos
      SFC_LOCAL_ENABLED: false
      NACOS_ENABLED: true
      NACOS_SERVER_ADDR: nacos:8848
      # Nacos 鉴权账号：服务端已开启 Client API 鉴权，必须与 Nacos 控制台（8080）的管理员账号一致，
      # 缺失或错误会以 "User not found! Please check user exist or password is right!" 注册失败并中断启动
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?未设置 NACOS_PASSWORD：请在 .env 或部署环境中配置 Nacos 管理员密码（首次访问 8080 控制台时初始化）}
      SFC_INTERNAL_KEY: ${SFC_INTERNAL_KEY:?未设置 SFC_INTERNAL_KEY：请在 .env 或部署环境中配置不少于 32 字符的内部接口共享密钥}
      # RPC 地址使用 compose 服务名 aria2；shared-dir/remote-dir 对应同一宿主目录：
      #   宿主机 ./data/download/shared → 本服务 /shared/download、aria2 容器 /downloads。
      # P2P 开关 / 进度轮询间隔 / 无进度超时 / 种子体积上限由 core 后台「插件配置 → 离线下载 →
      # aria2 P2P 下载」统一配置（首次部署后需由管理员在 core 后台开启），改完最长 5 秒生效。
      SFC_DOWNLOAD_ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      SFC_DOWNLOAD_ARIA2_SECRET: ${ARIA2_RPC_SECRET:-sfc-aria2-dev-secret}
      SFC_DOWNLOAD_ARIA2_SHARED_DIR: /shared/download
      SFC_DOWNLOAD_ARIA2_REMOTE_DIR: /downloads

  # AI 助手服务
  sfc-ai-service:
    image: sfc/sfc-ai-service:latest
    container_name: sfc-ai-service
    build:
      context: .
      dockerfile: microservices/sfc-ai-service/Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    depends_on:
      # 等待 Nacos 健康检查通过（8848 就绪接口）后再启动，避免注册失败
      nacos:
        condition: service_healthy
    networks:
      - nacos
    environment:
      # 启用 Nacos
      SFC_LOCAL_ENABLED: false
      NACOS_ENABLED: true
      NACOS_SERVER_ADDR: nacos:8848
      # Nacos 鉴权账号：服务端已开启 Client API 鉴权，必须与 Nacos 控制台（8080）的管理员账号一致，
      # 缺失或错误会以 "User not found! Please check user exist or password is right!" 注册失败并中断启动
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?未设置 NACOS_PASSWORD：请在 .env 或部署环境中配置 Nacos 管理员密码（首次访问 8080 控制台时初始化）}
      SFC_INTERNAL_KEY: ${SFC_INTERNAL_KEY:?未设置 SFC_INTERNAL_KEY：请在 .env 或部署环境中配置不少于 32 字符的内部接口共享密钥}
    volumes:
      # SQLite 数据库 ai.db 所在目录（镜像内 /data），重建容器不丢数据
      - ./data/ai:/data
    expose:
      - 8091

  # 网关服务
  sfc-gateway:
    image: sfc/sfc-gateway:latest
    container_name: sfc-gateway
    build:
      context: .
      dockerfile: microservices/sfc-gateway/Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    depends_on:
      # 网关自身也是 Nacos 客户端：等注册中心健康检查通过后再启动，避免注册失败中断启动
      nacos:
        condition: service_healthy
    networks:
      - nacos
    environment:
      NACOS_ENABLED: true
      SFC_LOCAL_ENABLED: false
      NACOS_SERVER_ADDR: nacos:8848
      # Nacos 鉴权账号：服务端已开启 Client API 鉴权，必须与 Nacos 控制台（8080）的管理员账号一致，
      # 缺失或错误会以 "User not found! Please check user exist or password is right!" 注册失败并中断启动
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?未设置 NACOS_PASSWORD：请在 .env 或部署环境中配置 Nacos 管理员密码（首次访问 8080 控制台时初始化）}
      SFC_JWT_SECRET: ${SFC_JWT_SECRET:?未设置 SFC_JWT_SECRET：请在 .env 或部署环境中配置恰好 32 字符的 JWT 会话密钥}
      SFC_INTERNAL_KEY: ${SFC_INTERNAL_KEY:?未设置 SFC_INTERNAL_KEY：请在 .env 或部署环境中配置不少于 32 字符的内部接口共享密钥}
    expose:
      - 9090
    ports:
      - 9090:9090

  # 核心服务
  sfc-core:
    image: sfc/sfc-core:latest
    container_name: sfc-core
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      # 等待 Nacos 健康检查通过（8848 就绪接口）后再启动，避免注册失败
      nacos:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      JDBC_PARAMETER: useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SFC_JWT_SECRET: ${SFC_JWT_SECRET:?未设置 SFC_JWT_SECRET：请在 .env 或部署环境中配置恰好 32 字符的 JWT 会话密钥}
      SFC_INTERNAL_KEY: ${SFC_INTERNAL_KEY:?未设置 SFC_INTERNAL_KEY：请在 .env 或部署环境中配置不少于 32 字符的内部接口共享密钥}
      # 启用 Nacos，关闭 core 的进程内 local 注册中心（两者二选一，同时启用会因 Registration Bean 冲突启动失败）
      SFC_LOCAL_ENABLED: false
      NACOS_ENABLED: true
      NACOS_SERVER_ADDR: nacos:8848
      # Nacos 鉴权账号：服务端已开启 Client API 鉴权，必须与 Nacos 控制台（8080）的管理员账号一致，
      # 缺失或错误会以 "User not found! Please check user exist or password is right!" 注册失败并中断启动
      NACOS_USERNAME: ${NACOS_USERNAME:-nacos}
      NACOS_PASSWORD: ${NACOS_PASSWORD:?未设置 NACOS_PASSWORD：请在 .env 或部署环境中配置 Nacos 管理员密码（首次访问 8080 控制台时初始化）}
      # 注册到 Nacos 的地址（映射 spring.cloud.nacos.discovery.ip）：必须是所有调用方都能解析的地址。
      # 这里用 compose 服务名 sfc-core —— 与 core 同处 nacos 网络的 gateway / ai / download 会经Docker 内置 DNS 解析到 core 在该网络上的 IP。
      # 由于 core 同时接入 nacos 与 xyy-backend-net 两个网络，
      #    Docker 不保证网卡顺序，自动探测可能选中 xyy-backend-net 的 IP，导致只接 nacos 网络的服务连接超时。
      #    修改本服务名 / container_name 时需同步修改。
      ADVERTISE_ADDRESS: sfc-core
    networks:
      - nacos
      - xyy-backend-net
    expose:
      - 8087
    volumes:
      - ./data/core/store:/saltedfish/store
      # 映射静态链接的ffmpeg程序目录，以便插件的视频增强插件能够直接调用到ffmpeg二进制程序
#      - /usr/local/ffmpeg:/usr/local/ffmpeg

  # Redis 缓存
  redis:
    image: "redis:alpine"
    networks:
      - xyy-backend-net
    expose:
      - 6379

  # 核心服务用的 MySQL 数据库
  mysql:
    image: "mysql:8.0"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 5s
      retries: 10
      interval: 10s
    networks:
      - xyy-backend-net
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: xyy
    volumes:
      - ./data/core/mysql:/var/lib/mysql
    expose:
      - 3306

networks:
  # 数据网络：仅 sfc-core 与 mysql / redis 接入，不承载服务发现与业务互调。
  xyy-backend-net:
  # 服务互通网络（名称沿用 nacos）：注册中心 nacos 与所有需要互相调用的业务服务都接入。
  # 服务间一律用 compose 服务名寻址（如 http://sfc-core:8087），不要使用容器 IP；
  # 多网络容器（见 sfc-core 的 ADVERTISE_ADDRESS）注册到 Nacos 的地址必须是本网络内可解析的名字。
  nacos:
