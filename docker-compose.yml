services:
  web-backend:
    image: saltedfishcloud:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://repo.maven.apache.org/maven2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      JDBC_PARAMETER: useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      # 必填，无缺省值：JWT 会话密钥，恰好 32 个字符（例如 openssl rand -hex 16）。网关 sfc-gateway 必须注入同一值
      SFC_JWT_SECRET: ${SFC_JWT_SECRET:?未设置 SFC_JWT_SECRET：请在 .env 或部署环境中配置恰好 32 字符的 JWT 会话密钥}
      # 必填，无缺省值：服务间内部接口共享密钥，不少于 32 个字符
      SFC_INTERNAL_KEY: ${SFC_INTERNAL_KEY:?未设置 SFC_INTERNAL_KEY：请在 .env 或部署环境中配置不少于 32 字符的内部接口共享密钥}
    expose:
      - 8087
    ports:
      - name: xyy-backend-port
        target: 8087
        published: 8087
    networks:
      - xyy-backend-net
    volumes:
      - type: volume
        source: xyy-store-vol
        target: /saltedfish/store
  redis:
    image: "redis:alpine"
    networks:
      - xyy-backend-net
    expose:
      - 6379
  mysql:
    image: "mysql:8.0"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 5s
      retries: 10
      interval: 10s
    networks:
      - xyy-backend-net
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: xyy
    volumes:
      - type: volume
        source: xyy-mysql-data
        target: /var/lib/mysql
    expose:
      - 3306

networks:
  xyy-backend-net:

volumes:
  xyy-store-vol:
  xyy-mysql-data:
