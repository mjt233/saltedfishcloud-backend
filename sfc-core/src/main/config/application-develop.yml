# ============================================================================
# 本地开发专用配置（--spring.profiles.active=develop）
#
# 默认使用 SQLite + 进程内缓存/资源锁，无需启动 MySQL；Redis 仅在用到默认 MQ 时连接。
# 个人覆盖（切 MySQL/Redis、加载本地插件工程等）写在仓库根的 ./config-local.yml，
# 本文件通过 spring.config.import 自动导入该文件（不存在时忽略，且该文件已 gitignore）。
#
# 发布包不加载本文件；需要时通过命令行参数或环境变量 SPRING_PROFILES_ACTIVE=develop 启用。
# ============================================================================

spring:
  config:
    import: optional:file:./config-local.yml
  jpa:
    database: default
    show-sql: true
  thymeleaf:
    cache: false
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: "jdbc:sqlite:./xyy.db"
  cloud:
    sfc-local:
      registry:
        # 本地开发对外开放注册接口，密码与微服务侧的默认值保持一致，便于本地联调网关/微服务
        password: "${SFC_LOCAL_REGISTRY_PASSWORD:114514}"

logging:
  level:
    test: info
    com.sfc: debug
    com.xiaotao: debug
    com.saltedfishcloud: debug
    com.xiaotao.saltedfishcloud.aspect: info

sys:
  # 开发环境默认密钥，仅用于本地调试；需要固定值时可注入 SFC_JWT_SECRET
  jwt-secret: "${SFC_JWT_SECRET:dev-only-jwt-secret-0123456789ab}"
  service:
    # 本地开发默认不依赖 Redis：缓存与资源锁使用进程内实现
    cache-provider: local
    lock-provider: local
    # MQ 默认仍走 redis；启用 sfc-ext-local-mq 插件后可在 config-local.yml 中改为 local（RPC 可随之为 local）
    rpc-provider: mq

