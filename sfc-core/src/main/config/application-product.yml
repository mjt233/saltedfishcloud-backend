logging:
  level:
    org: warn
    com: warn
    com.xiaotao: info
    com.saltedfishcloud: info


sys:
  redis:
    # Redis 是否启用，默认为 true。设置为 false 可以��不启动 Redis 的情况下运行系统
    # 注意：禁用Redis会影响缓存（cache-provider需设置为local）、资源锁（lock-provider需设置为local）、消息队列（mq-provider设置为local）、RPC等功能
    enabled: true
  service:
    # 缓存provider，默认 redis，可选 local（程序内缓存）
    cache-provider: redis
    # 资源锁 provider，默认 redisson，可选 local（仅当前服务实例内生效，且不注入 Redisson）
    lock-provider: redisson
    # MQ provider，默认 redis
    # 启用 sfc-ext-local-mq 插件时，可选local。使用local仅支持单 JVM 进程内消息语义
    mq-provider: redis
    # RPC provider，默认 redis，可选 mq（基于 MQService 实现）
    rpc-provider: redis
    # 服务注册 provider，默认 local（进程内注册表，未启用微服务模式）。可选 nacos（需 sfc-ext-nacos 插件）
    registry-provider: local
    # 注册到注册中心的自身服务名
    service-name: sfc-core
    # 注册中心分组，对应 Nacos 的 group。跨服务的互相可见依赖"所有服务注册到同一分组"这一部署约定
    registry-group: SFC
    # 本机对外可达地址（host 或 IP，不含端口）。多网卡 / 容器 / NAS 环境下自动解析出的地址可能不可达，此时显式指定；留空表示自动解析
    advertise-address: ""
    # Nacos provider 专属配置，仅在 registry-provider 为 nacos 时生效（由 sfc-ext-nacos 插件绑定）
    nacos:
      # 服务端地址，多节点用逗号分隔
      server-addr: 127.0.0.1:8848
      # 命名空间 ID。留空表示 public 命名空间（它的 ID 是空串，不要写 public）
      namespace: ""
      # 鉴权用户名与密码，服务端未开启鉴权时留空
      username: ""
      password: ""
      # 集群名，用于同一服务内实例的再分组
      cluster-name: DEFAULT
    # 委托令牌（内部服务鉴权）机制，见 docs/plan/microservice/microservice-service-auth-design.md
    auth:
      # 默认关闭：功能未启用时不阻断既有部署的启动。
      # 注意语义：false 表示"关闭"，不是"放开"——/api/internal/** 仍注册过滤器链并一律 401
      enabled: false
      # 签名私钥（PKCS#8）。单行 base64(DER) 或多行 PEM 均可。
      # ⚠️ 生产环境【只】通过环境变量 SERVICE_AUTH_SIGNING_KEY 注入，此处【绝不可】写入真实私钥。
      #    显式启用（enabled=true）后若仍未提供私钥，应用将拒绝启动（fail-fast）。
      signing-key: ${SERVICE_AUTH_SIGNING_KEY:}
      # 控制面令牌 TTL（秒），设计约束为不超过 60 秒
      token-ttl-seconds: 60
      # 数据面（下载）令牌 TTL（秒），阶段 9 使用
      download-token-ttl-seconds: 300
      # aud 追加白名单，与"已注册服务名集合"取并集；为空表示只用注册中心里的服务名
      allowed-audiences: []
    local-cache:
      # 本地缓存默认过期时间（毫秒），默认 15 分钟
      default-expire-ms: 900000
      # 本地缓存最大数量，超过后按最旧写入顺序淘汰
      max-cache-size: 4096
      # 是否启用本地缓存持久化，启用后会定时异步刷盘，并在系统关闭时再次落盘
      persist-enabled: true
      # 本地缓存持久化文件路径，系统启动时会尝试从该文件恢复缓存内容
      persist-file-path: ./localcache.data
    local-mq:
      # 本地消息队列的历史消息记录最长长度，默认为 4096。过大的值可能会导致OOM
      max-queue-size: 4096
      # 淘汰目标比例，消息数超出 max-queue-size 时淘汰至 max-queue-size * evict-target-ratio，默认 0.85
      evict-target-ratio: 0.85
  store:
    # 压缩文件操作使用的文件编码格式，默认使用系统默认编码，Linux: UTF-8，Windows: GBK
    archive-encoding: gbk

    # 存储服务类型，可选local、minio（需要拓展）、hdfs（需要拓展）
    type: local

    # 各类资源根目录存储路径
    root: store

    # 公共网盘根目录路径
    public-root: public

    # minio存储配置
    minio:
      access-key: xyy
      secret-key: xyy123456
      bucket: xyy

    # hdfs存储配置
    hdfs:
      url: hdfs://localhost:9000
      root: /xyy2
      user: xiaotao
